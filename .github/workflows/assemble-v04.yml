name: Assemble verified round equipment sources
on:
  push:
    branches: [feature/round-equipment-v04]
    paths: ['.integration/v04/**', '.github/workflows/assemble-v04.yml']
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/round-equipment-v04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate exact source manifest
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, json, subprocess
          from pathlib import Path, PurePosixPath
          parts = [Path(f'.integration/v04/{i:02}.b64').read_text() for i in range(8)]
          # Restore an explicitly identified 67-byte text-transfer omission.
          needle = 'srYJsrZG6nc'
          replacement = 'srYJIchHAHZArQ55od8y4FpW6ehDEJDK1EgJ6FkCSnbeIsW9TcjrG4w+BWZxxdzAfcMLEgssrZG6nc'
          assert parts[4].count(needle) == 1
          parts[4] = parts[4].replace(needle, replacement)
          raw = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f32dd50e921996e4769d7ee61d455579d0b5496ae9182b1186ed1177756d425b'
          manifest = json.loads(raw)
          assert manifest['base'] == '1b058aea11d0e20886b3f34583c7913b1c55f6be'
          subprocess.run(['git', 'merge-base', '--is-ancestor', manifest['base'], 'HEAD'], check=True)
          pending = {}
          for name, spec in manifest['files'].items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in {'src', 'tests', 'scripts', 'docs', 'README.md', 'CHANGELOG.md', 'styles.css', 'package.json', 'requirements-browser.txt'}
              target = Path(name)
              old = target.read_bytes() if target.exists() else None
              if spec['previous_sha256'] is None:
                  assert old is None, name
              else:
                  assert old is not None and hashlib.sha256(old).hexdigest() == spec['previous_sha256'], name
              if 'content' in spec:
                  content = spec['content'].encode('utf-8')
              else:
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  output = []
                  for segment in spec['segments']:
                      if isinstance(segment, str):
                          output.append(segment)
                      else:
                          start, end = segment
                          assert 0 <= start <= end <= len(lines)
                          output.append(''.join(lines[start:end]))
                  content = ''.join(output).encode('utf-8')
              assert hashlib.sha256(content).hexdigest() == spec['sha256'], name
              pending[name] = content
          assert len(pending) == 34
          for name, content in pending.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          Path('.integration/v04/manifest.json').write_bytes(raw)
          print('Verified and assembled all 34 source files against exact local SHA-256 hashes.')
          PY
      - name: Build and verify standalone launcher
        run: |
          npm run build
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('.integration/v04/manifest.json').read_text())
          assert hashlib.sha256(Path('index.html').read_bytes()).hexdigest() == manifest['generated_sha256']
          print('Standalone HTML matches the locally tested build exactly.')
          PY
          npm run check
          npm run simulate -- --strict
      - name: Commit tested source and launcher
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          manifest = json.loads(Path('.integration/v04/manifest.json').read_text())
          subprocess.run(['git', 'add', '--', *manifest['files'].keys(), 'index.html'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate equipment-driven rounds, reactions, campaign and offline UI'
          git push origin HEAD:feature/round-equipment-v04
      - uses: actions/upload-artifact@v4
        with:
          name: verified-v04-assembly
          path: |
            .integration/v04/manifest.json
            test-results/simulation-results.json
