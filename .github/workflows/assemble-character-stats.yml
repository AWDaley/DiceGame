name: Assemble verified character stats

# Temporary, feature-branch-only integration job; removed before merging.
on:
  push:
    branches: [feature/character-stats-v03]
    paths:
      - '.implementation/**'
      - '.github/workflows/assemble-character-stats.yml'

permissions:
  contents: read

concurrency:
  group: assemble-character-stats
  cancel-in-progress: false

jobs:
  assemble:
    if: github.repository == 'AWDaley/DiceGame' && github.ref == 'refs/heads/feature/character-stats-v03'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/character-stats-v03
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decode and validate exact integration patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          encoded = pathlib.Path('.implementation/stats.patch.zlib.base64').read_text().strip()
          # Correct known transport transcription artifacts, then authenticate all bytes.
          for before, after in [
              ('GI+q7x2ccte', 'GI+q2ccte'),
              ('2oY1yNmaZZ', '2oY1yVmaZZ'),
              ('PfS4eeq1yP4rw', 'PfS4eeq1y4rw'),
              ('iQC/bOtukhkt33', 'iQC/bOt33'),
          ]:
              encoded = encoded.replace(before, after)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          expected = 'dd83fdadb8f1ea79af10453019094992251309da66f8ed0d7872de40ff797445'
          actual = hashlib.sha256(patch).hexdigest()
          if actual != expected:
              raise SystemExit(f'Integration checksum mismatch: {actual}')
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          PY
      - name: Verify source against locally tested files
        run: sha256sum --check .implementation/stats-files.sha256
      - name: Build offline launcher and run all tests
        run: |
          npm run build
          npm run check
          git hash-object index.html
      - name: Commit verified source and generated launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = [line.split('  ', 1)[1] for line in Path('.implementation/stats-files.sha256').read_text().splitlines()]
          subprocess.run(['git', 'add', '--', *files, 'index.html'], check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrate character stats, talents, Focus and offline UI'
          git push origin HEAD:feature/character-stats-v03
      - name: Preserve public integration inputs for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-stats-verification
          path: .implementation/
          include-hidden-files: true
          retention-days: 1
